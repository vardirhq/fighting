name: Deploy web game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fighting-pages-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Fighting
        uses: actions/checkout@v4
        with:
          path: fighting

      - name: Read pinned Sindri revision
        id: engine
        shell: bash
        run: echo "ref=$(tr -d '\r\n' < fighting/.sindri-engine)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Sindri
        uses: actions/checkout@v4
        with:
          repository: vardirhq/sindri-engine
          ref: ${{ steps.engine.outputs.ref }}
          path: sindri-engine

      - name: Install Sindri Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config xvfb xauth libvulkan1 mesa-vulkan-drivers

      - name: Cache Sindri build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sindri-engine -> target
          key: fighting-pages-${{ steps.engine.outputs.ref }}

      - name: Restore Sindri browser host
        id: browser-host-cache
        uses: actions/cache@v4
        with:
          path: sindri-engine/game/pkg
          key: sindri-browser-host-${{ runner.os }}-${{ steps.engine.outputs.ref }}-wasm-pack-0.13.1

      - name: Install wasm-pack
        if: steps.browser-host-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Type-check Fighting Decay
        working-directory: sindri-engine
        run: cargo run --quiet --package decay-lsp -- --check ../fighting

      - name: Build Sindri browser host
        if: steps.browser-host-cache.outputs.cache-hit != 'true'
        working-directory: sindri-engine
        run: wasm-pack build game --target web --release --out-dir pkg

      - name: Export Fighting for web
        working-directory: sindri-engine
        run: cargo run --quiet --package sindri-export --bin sindri-export -- ../fighting "$RUNNER_TEMP/fighting-pages" --base /fighting/ --build-id "${GITHUB_SHA:0:7}"

      - name: Copy browser host into export
        working-directory: sindri-engine
        run: |
          mkdir -p "$RUNNER_TEMP/fighting-pages/pkg"
          cp -R game/pkg/. "$RUNNER_TEMP/fighting-pages/pkg/"
          touch "$RUNNER_TEMP/fighting-pages/.nojekyll"

      - name: Verify web export
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/fighting-pages/index.html"
          test -f "$RUNNER_TEMP/fighting-pages/pkg/sindri_causeway.js"
          test -f "$RUNNER_TEMP/fighting-pages/pkg/sindri_causeway_bg.wasm"
          grep -q '<base href="/fighting/">' "$RUNNER_TEMP/fighting-pages/index.html"

      - name: Upload exported game for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fighting-web-preview
          path: ${{ runner.temp }}/fighting-pages

      - name: Install browser verification tools
        run: |
          npm ci --prefix fighting/tests/web --no-audit --no-fund
          cd fighting/tests/web
          npx playwright install --with-deps chromium

      - name: Observe desktop and mobile exported gameplay
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/browser-site"
          ln -s "$RUNNER_TEMP/fighting-pages" "$RUNNER_TEMP/browser-site/fighting"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/browser-site" > "$RUNNER_TEMP/browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          CAPTURE_DIR="$RUNNER_TEMP/fighting-captures" xvfb-run -a -s "-screen 0 1280x720x24" node fighting/tests/web/fighters.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fighting-browser-captures
          path: ${{ runner.temp }}/fighting-captures
          if-no-files-found: warn

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/fighting-pages

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Fighting
        uses: actions/checkout@v4
        with:
          path: fighting

      - name: Read pinned Sindri revision
        id: engine
        shell: bash
        run: echo "ref=$(tr -d '\r\n' < fighting/.sindri-engine)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Sindri
        uses: actions/checkout@v4
        with:
          repository: vardirhq/sindri-engine
          ref: ${{ steps.engine.outputs.ref }}
          path: sindri-engine

      - name: Install Sindri Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Cache Sindri build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sindri-engine -> target
          key: fighting-pages-${{ steps.engine.outputs.ref }}

      - name: Type-check Fighting Decay
        working-directory: sindri-engine
        run: cargo run --quiet --package decay-lsp -- --check ../fighting

      - name: Export Fighting for web
        working-directory: sindri-engine
        run: cargo run --package sindri-export --bin sindri-export -- ../fighting "$RUNNER_TEMP/fighting-pages" --build-id "$GITHUB_SHA"

      - name: Verify web export
        run: test -f "$RUNNER_TEMP/fighting-pages/index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/fighting-pages

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
